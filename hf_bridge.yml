name: Huge File to HuggingFace
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Download URL'
        required: true
      filename:
        description: 'Filename'
        required: true
        default: 'file.safetensors'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: pip install huggingface_hub
      
      - name: Download
        run: |
          sudo apt-get install -y aria2
          aria2c -x 16 -s 16 -o "${{ inputs.filename }}" "${{ inputs.url }}"
          
      - name: Upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          api = HfApi()
          api.upload_file(
              path_or_fileobj='${{ inputs.filename }}',
              path_in_repo='${{ inputs.filename }}',
              repo_id='YOUR_HF_USERNAME/YOUR_DATASET_NAME',
              repo_type='dataset',
              token='${{ env.HF_TOKEN }}'
          )"
