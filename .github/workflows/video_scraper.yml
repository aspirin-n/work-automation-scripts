name: Cloud Video Downloader

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Paste the Video, Playlist, or Channel URL(s) separated by a space'
        required: true

      quality:
        description: 'Select maximum video resolution'
        required: true
        default: '480p'
        type: choice
        options:
          - 'best'
          - '720p'
          - '480p'
          - 'audio-only (MP3)'

permissions:
  contents: write

jobs:
  download-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Install yt-dlp, Stable Hanime Plugin, and Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default,curl_cffi]"
          
          # Stable PyPI version which doesn't crash on handshake
          python -m pip install --upgrade hanime-plugin

          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Parse and Generate Cookies File
        env:
          HANIME_COOKIES: ${{ secrets.HANIME_COOKIES }}
        shell: python
        run: |
          import os
          import re
          import sys

          raw_cookies = os.environ.get("HANIME_COOKIES", "").strip()
          if not raw_cookies:
              print("ERROR: HANIME_COOKIES secret is completely empty!")
              sys.exit(1)

          if "Netscape" in raw_cookies or "\t" in raw_cookies:
              lines = raw_cookies.splitlines()
              fixed_lines = []
              for line in lines:
                  if line.strip() == "" or line.startswith('#'):
                      fixed_lines.append(line)
                      continue
                  parts = re.split(r'\s+', line.strip())
                  if len(parts) >= 7:
                      fixed_lines.append("\t".join(parts[:7]))
                  else:
                      fixed_lines.append(line)
              with open("cookies.txt", "w") as f:
                  f.write("\n".join(fixed_lines) + "\n")
              print("SUCCESS: Cookie file generated.")
          else:
              token = None
              if "=" in raw_cookies:
                  cookie_parts = re.split(r';\s*', raw_cookies)
                  for part in cookie_parts:
                      if '=' in part:
                          k, v = part.split('=', 1)
                          if k.strip() == "active_session_token":
                              token = v.strip()
                              break
              else:
                  token = raw_cookies

              if token:
                  cookie_content = (
                      "# Netscape HTTP Cookie File\n"
                      f".hanime.tv\tTRUE\t/\tTRUE\t2051222400\tactive_session_token\t{token}\n"
                      f"hanime.tv\tTRUE\t/\tTRUE\t2051222400\tactive_session_token\t{token}\n"
                      f"auth.hanime.tv\tTRUE\t/\tTRUE\t2051222400\tactive_session_token\t{token}\n"
                  )
                  with open("cookies.txt", "w") as f:
                      f.write(cookie_content)
                  print("SUCCESS: Cookie file generated from raw token.")
              else:
                  print("ERROR: Could not find 'active_session_token' in your secret.")
                  sys.exit(1)

      # DIAGNOSTIC: Prints exactly what cookies yt-dlp has loaded
      - name: Verify yt-dlp Cookie Loading
        shell: python
        run: |
          import yt_dlp
          import sys
          try:
              ydl = yt_dlp.YoutubeDL({'cookiefile': 'cookies.txt', 'quiet': True})
              cookies = list(ydl.cookiejar)
              print("=== YT-DLP COOKIE JAR DIAGNOSTICS ===")
              if not cookies:
                  print("❌ yt-dlp failed to load any cookies from cookies.txt!")
                  sys.exit(1)
              else:
                  print(f"✅ yt-dlp successfully loaded {len(cookies)} cookies:")
                  for c in cookies:
                      val = c.value
                      masked = f"{val[:4]}...{val[-4:]}" if len(val) > 8 else "***"
                      print(f"   • Domain: {c.domain} | Cookie Name: {c.name} | Value: {masked}")
              print("======================================")
          except Exception as e:
              print(f"❌ Diagnostic failed: {e}")
              sys.exit(1)

      # FIX: Forced IPv4 only to prevent Azure WireGuard routing hang
      - name: Set up WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: ipv4

      - name: Verify Installation & IP
        run: |
          echo "yt-dlp version:"
          yt-dlp --version

          echo "Python version:"
          python --version

          echo "Deno version:"
          deno --version

          echo "Your Action's External IP (Should show Cloudflare WARP):"
          curl -s ifconfig.me || true
          echo ""

          echo "Hanime extractor:"
          yt-dlp --list-extractors | grep -i hanime || true

      - name: Execute Cloud Video Download
        env:
          TARGET_URLS: ${{ github.event.inputs.target_url }}
        run: |
          ARGS="--impersonate chrome \
          --cookies cookies.txt \
          --referer https://hanime.tv/ \
          --retries 10 \
          --fragment-retries 10 \
          --file-access-retries 10 \
          --sleep-interval 5 \
          --max-sleep-interval 15 \
          --continue \
          --no-part \
          --verbose"

          # Handle Resolution with Fallbacks
          if [ "${{ github.event.inputs.quality }}" = "720p" ]; then
            ARGS="$ARGS -f 720p/720/best[height<=720]/best"

          elif [ "${{ github.event.inputs.quality }}" = "480p" ]; then
            ARGS="$ARGS -f 480p/480/best[height<=480]/best"

          elif [ "${{ github.event.inputs.quality }}" = "audio-only (MP3)" ]; then
            ARGS="$ARGS -f bestaudio/best -x --audio-format mp3"

          else
            ARGS="$ARGS -f best"
          fi

          mkdir -p downloads

          for url in $TARGET_URLS; do
            echo "======================================"
            echo "Starting download for: $url"
            echo "======================================"

            yt-dlp $ARGS \
              -o "downloads/%(title)s.%(ext)s" \
              "$url"
          done

      - name: Compress Video Files
        if: success()
        run: |
          if [ -d "downloads" ] && [ "$(ls -A downloads)" ]; then
            zip -r videos.zip downloads/
          else
            echo "No files downloaded, skipping compression."
            exit 1
          fi

      - name: Publish Video to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-run-${{ github.run_number }}
          name: "Video Download #${{ github.run_number }}"
          body: "Cloud backup completed for: ${{ github.event.inputs.target_url }}"
          files: videos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
