name: Cloud Video Downloader (Hani-Hunter)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Paste the hanime.tv video URL'
        required: true
      quality:
        description: 'Select maximum video resolution'
        required: true
        default: '720p'
        type: choice
        options:
          - '1080p'
          - '720p'
          - '480p'

permissions:
  contents: write

jobs:
  download-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Install hanime-hunter
        run: |
          go install -ldflags "-s -w" github.com/acgtools/hanime-hunter@latest

      - name: Execute Download
        run: |
          mkdir -p downloads
          
          # Locate the compiled binary directly in Go's bin folder
          GOPATH_BIN=$(go env GOPATH)/bin
          
          if [ -f "$GOPATH_BIN/hanime-hunter" ]; then
            BINARY="$GOPATH_BIN/hanime-hunter"
          elif [ -f "$GOPATH_BIN/hani" ]; then
            BINARY="$GOPATH_BIN/hani"
          else
            # Fallback to search for any compiled executable in the go bin folder
            BINARY=$(find "$GOPATH_BIN" -maxdepth 1 -type f -executable | head -n 1)
          fi

          if [ -z "$BINARY" ]; then
            echo "Error: Could not find the compiled binary in $GOPATH_BIN"
            exit 1
          fi

          echo "Successfully located binary at: $BINARY"

          # Execute the download using the absolute path
          $BINARY dl \
            -o downloads \
            -q "${{ github.event.inputs.quality }}" \
            "${{ github.event.inputs.target_url }}"

      - name: Compress Video Files
        if: success()
        run: |
          if [ -d "downloads" ] && [ "$(ls -A downloads)" ]; then
            zip -r videos.zip downloads/
          else
            echo "No files downloaded, skipping compression."
            exit 1
          fi

      - name: Publish Video to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-run-${{ github.run_number }}
          name: "Video Download #${{ github.run_number }}"
          body: "Cloud backup completed for: ${{ github.event.inputs.target_url }}"
          files: videos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
