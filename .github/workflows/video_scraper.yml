name: Cloud Video Downloader

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Paste the Video, Playlist, or Channel URL'
        required: true
      max_videos:
        description: 'Max videos to pull (if pasting a playlist/channel). Leave empty for single video.'
        required: false
        default: '1'
      quality:
        description: 'Select maximum video resolution'
        required: true
        default: '720p'
        type: choice
        options:
          - 'best'
          - '720p'
          - '480p'
          - 'audio-only (MP3)'

permissions:
  contents: write

jobs:
  download-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Execute Cloud Video Download
        run: |
          # Build arguments dynamically based on your dashboard choices
          ARGS=""
          
          # Handle Resolution
          if [ "${{ github.event.inputs.quality }}" = "720p" ]; then
            ARGS="$ARGS -f bestvideo[height<=720]+bestaudio/best[height<=720]"
          elif [ "${{ github.event.inputs.quality }}" = "480p" ]; then
            ARGS="$ARGS -f bestvideo[height<=480]+bestaudio/best[height<=480]"
          elif [ "${{ github.event.inputs.quality }}" = "audio-only (MP3)" ]; then
            ARGS="$ARGS -f bestaudio -x --audio-format mp3"
          fi
          
          # Handle Max Downloads limit
          if [ ! -z "${{ github.event.inputs.max_videos }}" ]; then
            ARGS="$ARGS --max-downloads ${{ github.event.inputs.max_videos }}"
          fi
          
          # Run the downloader and output files to a 'downloads' folder
          yt-dlp $ARGS -o "downloads/%(title)s.%(ext)s" "${{ github.event.inputs.target_url }}"

      - name: Compress Video Files
        if: always()
        run: |
          zip -r videos.zip downloads/ || echo "No files downloaded"

      - name: Publish Video to Releases
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-run-${{ github.run_number }}
          name: "Video Download #${{ github.run_number }}"
          body: "Cloud backup completed for: ${{ github.event.inputs.target_url }}"
          files: videos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
