name: Cloud Video Downloader

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Paste the Video, Playlist, or Channel URL(s) separated by a space'
        required: true

      quality:
        description: 'Select maximum video resolution'
        required: true
        default: '480p'
        type: choice
        options:
          - 'best'
          - '720p'
          - '480p'
          - 'audio-only (MP3)'

permissions:
  contents: write

jobs:
  download-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Install yt-dlp, Latest Hanime Plugin, and Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default,curl_cffi]"
          python -m pip install --upgrade git+https://github.com/cynthia2006/hanime-plugin.git

          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Restore Browser Cookies
        env:
          HANIME_COOKIES: ${{ secrets.HANIME_COOKIES }}
        run: |
          if [ -z "$HANIME_COOKIES" ]; then
            echo "HANIME_COOKIES secret is missing."
            exit 1
          fi

          printf "%s" "$HANIME_COOKIES" > cookies.txt
          chmod 600 cookies.txt

      - name: Set up WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual

      - name: Verify Installation & IP
        run: |
          echo "yt-dlp version:"
          yt-dlp --version

          echo "Python version:"
          python --version

          echo "Deno version:"
          deno --version

          echo "Your Action's External IP (Should show Cloudflare WARP):"
          curl -s ifconfig.me || true
          echo ""

          echo "Hanime extractor:"
          yt-dlp --list-extractors | grep -i hanime || true

      - name: Execute Cloud Video Download
        env:
          TARGET_URLS: ${{ github.event.inputs.target_url }}
        run: |
          # RESTORED "--impersonate chrome" to fix the 422 handshake error
          ARGS="\
          --impersonate chrome \
          --cookies cookies.txt \
          --referer https://hanime.tv/ \
          --retries 10 \
          --fragment-retries 10 \
          --file-access-retries 10 \
          --sleep-interval 5 \
          --max-sleep-interval 15 \
          --continue \
          --no-part \
          --verbose"

          # Handle Resolution with Fallbacks
          if [ "${{ github.event.inputs.quality }}" = "720p" ]; then
            ARGS="$ARGS -f 720p/720/best[height<=720]/best"

          elif [ "${{ github.event.inputs.quality }}" = "480p" ]; then
            ARGS="$ARGS -f 480p/480/best[height<=480]/best"

          elif [ "${{ github.event.inputs.quality }}" = "audio-only (MP3)" ]; then
            ARGS="$ARGS -f bestaudio/best -x --audio-format mp3"

          else
            ARGS="$ARGS -f best"
          fi

          mkdir -p downloads

          for url in $TARGET_URLS; do
            echo "======================================"
            echo "Starting download for: $url"
            echo "======================================"

            yt-dlp $ARGS \
              -o "downloads/%(title)s.%(ext)s" \
              "$url"
          done

      - name: Compress Video Files
        if: success()
        run: |
          if [ -d "downloads" ] && [ "$(ls -A downloads)" ]; then
            zip -r videos.zip downloads/
          else
            echo "No files downloaded, skipping compression."
            exit 1
          fi

      - name: Publish Video to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-run-${{ github.run_number }}
          name: "Video Download #${{ github.run_number }}"
          body: "Cloud backup completed for: ${{ github.event.inputs.target_url }}"
          files: videos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
