name: Cloud Video Downloader

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Paste the Video, Playlist, or Channel URL(s) separated by a space'
        required: true
      quality:
        description: 'Select maximum video resolution'
        required: true
        default: '720p'
        type: choice
        options:
          - 'best'
          - '720p'
          - '480p'
          - 'audio-only (MP3)'

permissions:
  contents: write

jobs:
  download-video:
    runs-on: ubuntu-latest

# ... (Keep the beginning of your workflow file exactly as it is)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Install yt-dlp, Hanime Plugin, and Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default,curl_cffi]"
          python -m pip install --upgrade hanime-plugin

          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Restore Browser Cookies
        env:
          HANIME_COOKIES: ${{ secrets.HANIME_COOKIES }}
        run: |
          if [ -z "$HANIME_COOKIES" ]; then
            echo "HANIME_COOKIES secret is missing."
            exit 1
          fi

          printf "%s" "$HANIME_COOKIES" > cookies.txt
          chmod 600 cookies.txt

      # ==========================================
      # ADDED: Set up Cloudflare WARP to mask your Azure IP
      # ==========================================
      - name: Set up WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual # Supports both IPv4 and IPv6 routing

      - name: Verify Installation
        run: |
          echo "yt-dlp version:"
          yt-dlp --version

          echo "Python version:"
          python --version

          echo "Deno version:"
          deno --version

          echo "Checking our external IP address (should show Cloudflare WARP):"
          curl ifconfig.me || true

          echo "Hanime extractor:"
          yt-dlp --list-extractors | grep -i hanime || true

      # ... (Keep the rest of your download, compression, and release steps exactly the same)
      - name: Execute Cloud Video Download
        env:
          TARGET_URLS: ${{ github.event.inputs.target_url }}
        run: |
          # Build arguments dynamically with impersonation, a spoofed referer, and cleared cookies
          ARGS="--impersonate chrome --no-cookies --referer 'https://www.pornhub.com/'"
          
          # Handle Resolution
          if [ "${{ github.event.inputs.quality }}" = "720p" ]; then
            ARGS="$ARGS -f bestvideo[height<=720]+bestaudio/best[height<=720]"
          elif [ "${{ github.event.inputs.quality }}" = "480p" ]; then
            ARGS="$ARGS -f bestvideo[height<=480]+bestaudio/best[height<=480]"
          elif [ "${{ github.event.inputs.quality }}" = "audio-only (MP3)" ]; then
            ARGS="$ARGS -f bestaudio -x --audio-format mp3"
          fi
          
          # Loop through each space-separated link and drop them in the downloads folder
          for url in $TARGET_URLS; do
            echo "Starting download for: $url"
            yt-dlp $ARGS -o "downloads/%(title)s.%(ext)s" "$url"
          done

      - name: Compress Video Files
        if: success()
        run: |
          if [ -d "downloads" ] && [ "$(ls -A downloads)" ]; then
            zip -r videos.zip downloads/
          else
            echo "No files downloaded, skipping compression."
            exit 1
          fi

      - name: Publish Video to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-run-${{ github.run_number }}
          name: "Video Download #${{ github.run_number }}"
          body: "Cloud backup completed for: ${{ github.event.inputs.target_url }}"
          files: videos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
