name: Civitai to HuggingFace

on:
  workflow_dispatch:
    inputs:
      civitai_url:
        description: 'Civitai Download URL'
        required: true
        type: string
      filename:
        description: 'Filename (e.g. model.gguf)'
        required: true
        default: 'model.safetensors'
      hf_repo:
        description: 'Your HuggingFace Dataset Name'
        required: true
        default: 'my-storage'

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          pip install huggingface_hub

      - name: Download from Civitai
        env:
          CIVITAI_TOKEN: ${{ secrets.CIVITAI_API_KEY }}
          CIVITAI_URL: ${{ inputs.civitai_url }}
          FILENAME: ${{ inputs.filename }}
        run: |
          echo "Starting download..."
          
          wget \
            --header="Authorization: Bearer $CIVITAI_TOKEN" \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --content-disposition \
            -O "$FILENAME" \
            "$CIVITAI_URL"
          
          echo ""
          echo "=== Download Complete ==="
          ls -lh "$FILENAME"

      - name: Upload to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FILENAME: ${{ inputs.filename }}
          HF_REPO: ${{ inputs.hf_repo }}
        run: |
          echo "Uploading to HuggingFace..."
          python3 << 'EOF'
          from huggingface_hub import HfApi
          import os

          api = HfApi()
          token = os.environ["HF_TOKEN"]
          filename = os.environ["FILENAME"]
          repo = os.environ["HF_REPO"]

          api.upload_file(
              path_or_fileobj=filename,
              path_in_repo=filename,
              repo_id=f"Arashm1386/{repo}",
              repo_type="dataset",
              token=token
          )
          print("Upload complete!")
          print(f"https://huggingface.co/datasets/Arashm1386/{repo}/resolve/main/{filename}")
          EOF
