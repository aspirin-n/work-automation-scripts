name: Civitai to HuggingFace

on:
  workflow_dispatch:
    inputs:
      civitai_url:
        description: 'Civitai Download URL'
        required: true
        type: string
      filename:
        description: 'Filename (e.g. model.safetensors)'
        required: true
        default: 'model.safetensors'
      hf_repo:
        description: 'Your HuggingFace Dataset Name (e.g. my-storage)'
        required: true
        default: 'my-storage'

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          pip install huggingface_hub

      - name: Download from Civitai
        env:
          CIVITAI_TOKEN: ${{ secrets.CIVITAI_API_KEY }}
        run: |
          echo "Starting download from Civitai..."
          aria2c -x 16 -s 16 \
            --header="Authorization: Bearer $CIVITAI_TOKEN" \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -o "${{ inputs.filename }}" \
            "${{ inputs.civitai_url }}"
          
          echo ""
          echo "=== Download Complete ==="
          echo "File size: $(du -h ${{ inputs.filename }} | cut -f1)"

      - name: Upload to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Uploading to HuggingFace..."
          python3 -c "
          from huggingface_hub import HfApi
          import os

          api = HfApi()
          token = os.environ['HF_TOKEN']

          api.upload_file(
              path_or_fileobj='${{ inputs.filename }}',
              path_in_repo='${{ inputs.filename }}',
              repo_id='Arashm1386/${{ inputs.hf_repo }}',
              repo_type='dataset',
              token=token
          )
          print('Upload complete!')
          print('Your file is at:')
          print(f'https://huggingface.co/datasets/Arashm1386/${{ inputs.hf_repo }}/resolve/main/${{ inputs.filename }}')
          "
