name: Download HF File, Split, and Release

on:
  workflow_dispatch:
    inputs:
      hf_url:
        description: 'Direct HF File URL (e.g., https://huggingface.co/org/repo/resolve/main/model.gguf)'
        required: true
        type: string
      tag_name:
        description: 'GitHub Release Tag Name (e.g., v1.0.0 or model-q8)'
        required: true
        type: string
      chunk_size:
        description: 'Chunk size (e.g., 1800M or 1.8G)'
        required: false
        default: '1800M'
        type: string

permissions:
  contents: write

jobs:
  process-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Download File from Hugging Face
        run: |
          echo "Downloading from: ${{ inputs.hf_url }}"
          
          # Extract the base filename from the URL (strip any query params)
          FILENAME=$(basename "${{ inputs.hf_url }}" | cut -d'?' -f1)
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          
          # Download using 16 connections for fast transfer speeds
          aria2c -x 16 -s 16 -o "$FILENAME" "${{ inputs.hf_url }}"

      - name: Split File into Chunks
        run: |
          mkdir -p dist
          echo "Splitting $FILENAME into ${{ inputs.chunk_size }} chunks..."
          
          # Generate files named: filename.gguf.part00, filename.gguf.part01, etc.
          split -b ${{ inputs.chunk_size }} -d -a 2 "$FILENAME" "dist/${FILENAME}.part"

          echo "Generated chunks:"
          ls -lh dist/

      - name: Create Release and Upload Chunks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name }}"
          
          # Create release if it doesn't exist yet
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating new release: $TAG"
            gh release create "$TAG" --title "Release $TAG" --notes "Uploaded chunks from Hugging Face: ${{ inputs.hf_url }}"
          fi

          # Upload all chunk files to the release
          echo "Uploading chunks..."
          gh release upload "$TAG" dist/* --clobber
