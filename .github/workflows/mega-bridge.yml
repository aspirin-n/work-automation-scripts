name: MEGA Link Bridge Downloader

on:
  workflow_dispatch:
    inputs:
      mega_url:
        description: 'The MEGA.nz folder or file URL'
        required: true
        type: string
      release_name:
        description: 'Name for the output ZIP file & Release tag (e.g., my-assets)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bridge-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Megatools directly from the Ubuntu repo
      - name: Install Megatools
        run: |
          sudo apt-get update
          sudo apt-get install -y megatools

      - name: Create Download Directory
        run: mkdir -p downloads

      # megadl is strictly synchronous. It will block the runner until the download is done.
      - name: Download from MEGA
        run: |
          cd downloads
          megadl '${{ github.event.inputs.mega_url }}'

      - name: Zip Downloaded Content
        run: |
          cd downloads
          zip -r ../${{ github.event.inputs.release_name }}.zip .
          cd ..

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_name }}-${{ github.run_id }}
          name: "Bridge Export: ${{ github.event.inputs.release_name }}"
          body: |
            Automated export from MEGA link.
            Original Link: `${{ github.event.inputs.mega_url }}`
          files: ${{ github.event.inputs.release_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
