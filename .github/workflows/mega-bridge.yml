name: MEGA Link Bridge Downloader

on:
  workflow_dispatch:
    inputs:
      mega_url:
        description: 'The MEGA.nz folder or file URL'
        required: true
        type: string
      release_name:
        description: 'Name for the output ZIP file & Release tag (e.g., my-assets)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bridge-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Download Directory
        run: mkdir -p downloads

      # 1. The fast multi-threaded downloader
      - name: Download from MEGA
        uses: Difegue/action-megacmd@master
        with:
          args: get '${{ github.event.inputs.mega_url }}' /github/workspace/downloads

      # FIX: Take back ownership of the files from the Docker root user
      - name: Fix File Permissions
        run: sudo chown -R $USER:$USER downloads

      # 2. Package everything into a structured ZIP file
      - name: Zip Downloaded Content
        run: |
          cd downloads
          zip -r ../${{ github.event.inputs.release_name }}.zip .
          cd ..

      # 3. Automatically push the finished file onto a GitHub Release
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_name }}-${{ github.run_id }}
          name: "Bridge Export: ${{ github.event.inputs.release_name }}"
          body: |
            Automated export from MEGA link.
            Original Link: `${{ github.event.inputs.mega_url }}`
          files: ${{ github.event.inputs.release_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
