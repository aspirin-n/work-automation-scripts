name: Scrape and Release Media

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'The main URL containing the sub-links to scrape'
        required: true
        type: string
      max_pages:
        description: 'Max sub-pages to check (e.g., 5). Type 0 for unlimited.'
        required: true
        default: '5'
        type: string
      max_files:
        description: 'Max total files to download (e.g., 50). Type 0 for unlimited.'
        required: true
        default: '50'
        type: string

jobs:
  scrape-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the Scraper
        env:
          TARGET_URL: ${{ inputs.target_url }}
          MAX_PAGES: ${{ inputs.max_pages }}
          MAX_FILES: ${{ inputs.max_files }}
        run: python downloader.py

      - name: Zip the downloaded media
        run: |
          if [ -d "downloaded_media" ] && [ "$(ls -A downloaded_media)" ]; then
            zip -r media_archive.zip downloaded_media/
          else
            echo "No media was downloaded. Creating an empty zip to prevent failure."
            touch empty.txt
            zip media_archive.zip empty.txt
          fi

      - name: Generate a timestamp for the Release Tag
        id: tag
        run: echo "release_tag=$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.release_tag }}
          name: Scraped Media - ${{ env.release_tag }}
          body: |
            Automated media scrape from: ${{ inputs.target_url }}
            Pages Checked: ${{ inputs.max_pages }}
            File Limit: ${{ inputs.max_files }}
          files: media_archive.zip
