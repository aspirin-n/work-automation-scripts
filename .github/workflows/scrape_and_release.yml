name: API Scrape and Release Media

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'The API Request URL. Replace the page number with {page}'
        required: true
        type: string
      media_base_url:
        description: 'The root URL for media (e.g., https://domain.com/)'
        required: true
        type: string
      start_page:
        description: 'Page number to start on'
        required: true
        default: '1'
        type: string
      max_files:
        description: 'Max total files to download. Type 0 for unlimited.'
        required: true
        default: '50'
        type: string

jobs:
  scrape-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the API Scraper
        env:
          API_URL: ${{ inputs.api_url }}
          MEDIA_BASE_URL: ${{ inputs.media_base_url }}
          RAW_HEADERS: ${{ secrets.RAW_HEADERS }}
        run: python -u downloader.py  # <-- The "-u" flag forces instant unbuffered logs

      - name: Zip the downloaded media
        run: |
          if [ -d "downloaded_media" ] && [ "$(ls -A downloaded_media)" ]; then
            zip -r media_archive.zip downloaded_media/
          else
            echo "No media was downloaded. Creating an empty zip to prevent failure."
            touch empty.txt
            zip media_archive.zip empty.txt
          fi

      - name: Generate a timestamp for the Release Tag
        id: tag
        run: echo "release_tag=$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.release_tag }}
          name: Scraped API Media - ${{ env.release_tag }}
          body: |
            Automated API media scrape utilizing secure session tokens.
            File Limit: ${{ inputs.max_files }}
          files: media_archive.zip
