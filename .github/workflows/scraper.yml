name: Cloud Media Scraper

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Paste the LeakGallery Profile URL'
        required: true
        default: 'https://leakgallery.com/ldrzelall'
      item_limit:
        description: 'How many items to download? (e.g., 1-30, or leave empty for ALL)'
        required: false
        default: '1-30'

# This gives the script permission to create a Release in your repo
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Automated Downloader
        run: |
          python -m pip install --upgrade pip
          pip install gallery-dl

      - name: Execute Cloud Download
        run: |
          RANGE_FLAG=""
          if [ ! -z "${{ github.event.inputs.item_limit }}" ]; then
            RANGE_FLAG="--range ${{ github.event.inputs.item_limit }}"
          fi
          
          gallery-dl $RANGE_FLAG --destination downloads "${{ github.event.inputs.target_url }}"

      - name: Compress Files into ZIP
        run: |
          zip -r gallery.zip downloads/ || echo "No files found to zip"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_number }}
          name: "Gallery Download #${{ github.run_number }}"
          body: "Automated media backup for ${{ github.event.inputs.target_url }}"
          files: gallery.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
