name: Cloud Media Scraper

on:
  workflow_dispatch: # This adds a manual "Run" button to your GitHub dashboard

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Automated Downloader
        run: |
          python -m pip install --upgrade pip
          pip install gallery-dl

      - name: Execute Cloud Download
        run: |
          gallery-dl "https://leakgallery.com/ldrzelall"

      - name: Package and Upload Gallery as ZIP
        if: always() # Ensures it tries to save whatever it managed to grab
        uses: actions/upload-artifact@v4
        with:
          name: leakgallery-archive
          path: gallery-dl/
          retention-days: 3
