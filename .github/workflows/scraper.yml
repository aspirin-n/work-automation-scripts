name: Cloud Media Scraper

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Paste the LeakGallery Profile URL'
        required: true
        default: 'https://leakgallery.com/ldrzelall'
      item_limit:
        description: 'How many items to download? (e.g., 1-20 for the first 20, or leave empty for ALL)'
        required: false
        default: '1-30'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Automated Downloader
        run: |
          python -m pip install --upgrade pip
          pip install gallery-dl

      - name: Execute Cloud Download
        run: |
          # If a limit is specified, add the range flag to gallery-dl
          RANGE_FLAG=""
          if [ ! -z "${{ github.event.inputs.item_limit }}" ]; then
            RANGE_FLAG="--range ${{ github.event.inputs.item_limit }}"
          fi
          
          gallery-dl $RANGE_FLAG "${{ github.event.inputs.target_url }}"

      - name: Package and Upload Gallery as ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leakgallery-archive
          path: gallery-dl/
          retention-days: 3
