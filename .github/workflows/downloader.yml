name: Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'The URL of the video to download'
        required: true
        type: string
      quality:
        description: 'Desired quality'
        required: true
        default: '720p'
        type: choice
        options:
          - 'best'
          - '1080p'
          - '720p'
          - '480p'
          - '360p'

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      # Upgraded to Python 3.11 to fix deprecation warning
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      # Installs yt-dlp with the curl-cffi impersonation library
      - name: Install yt-dlp & plugin
        run: |
          python -m pip install --upgrade pip
          pip install "yt-dlp[default,curl-cffi]" hanime-plugin

      - name: Download Video
        run: |
          QUALITY_INPUT="${{ github.event.inputs.quality }}"
          
          if [ "$QUALITY_INPUT" = "best" ]; then
            FORMAT="best"
          else
            HEIGHT=$(echo "$QUALITY_INPUT" | sed 's/p//')
            FORMAT="bestvideo[height<=${HEIGHT}]+bestaudio/best[height<=${HEIGHT}]"
          fi
          
          echo "Selected Format: $FORMAT"
          mkdir -p downloads
          
          # Added --impersonate chrome to spoof Cloudflare's TLS checks
          yt-dlp \
            --impersonate chrome \
            -f "$FORMAT" \
            -o "downloads/%(title)s.%(ext)s" \
            "${{ github.event.inputs.video_url }}"

      - name: Package files
        id: package
        run: |
          TAG_NAME="vid-$(date +'%Y%m%d-%H%M%S')"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          
          cd downloads
          if [ "$(ls -A)" ]; then
            zip -r ../videos.zip .
            echo "FILES_EXIST=true" >> $GITHUB_ENV
          else
            echo "No files downloaded!"
            echo "FILES_EXIST=false" >> $GITHUB_ENV
            exit 1
          fi

      - name: Create GitHub Release
        if: env.FILES_EXIST == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Downloaded Video (${{ env.TAG_NAME }})"
          files: videos.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
