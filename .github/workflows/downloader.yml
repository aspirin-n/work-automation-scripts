name: Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Paste one or more URLs (separated by a space)'
        required: true
        type: string
      quality:
        description: 'Desired quality'
        required: true
        default: '720p'
        type: choice
        options:
          - 'best'
          - '1080p'
          - '720p'
          - '480p'
          - '360p'

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Install yt-dlp & plugin
        run: |
          python -m pip install --upgrade pip
          pip install "yt-dlp[default,curl-cffi]" hanime-plugin

      - name: Download Videos
        run: |
          QUALITY_INPUT="${{ github.event.inputs.quality }}"
          mkdir -p downloads
          
          # Initialize release notes markdown file
          echo "### Downloaded Sources" > release_notes.md
          echo "This release contains the video files downloaded from the following links:" >> release_notes.md
          echo "" >> release_notes.md
          
          # Safely read space-separated URLs into a Bash array
          read -ra URLS <<< "${{ github.event.inputs.video_url }}"
          
          # Loop through each URL in the array
          for URL in "${URLS[@]}"; do
            echo "----------------------------------------"
            echo "Processing: $URL"
            echo "----------------------------------------"
            
            # Setup download arguments dynamically
            ARGS=(--impersonate chrome -o "downloads/%(title)s.%(ext)s")
            if [ "$QUALITY_INPUT" != "best" ]; then
              HEIGHT=$(echo "$QUALITY_INPUT" | sed 's/p//')
              echo "Targeting height: ${HEIGHT}p with automatic fallback"
              ARGS+=(-S "res:${HEIGHT}")
            fi
            
            # Run yt-dlp and check if successful to update release notes
            if yt-dlp "${ARGS[@]}" "$URL"; then
              echo "* $URL - **Success**" >> release_notes.md
            else
              echo "* ~~$URL~~ - **Failed**" >> release_notes.md
            fi
          done

      - name: Package files
        id: package
        run: |
          TAG_NAME="vid-$(date +'%Y%m%d-%H%M%S')"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          
          cd downloads
          if [ "$(ls -A)" ]; then
            zip -r ../videos.zip .
            echo "FILES_EXIST=true" >> $GITHUB_ENV
          else
            echo "No files downloaded!"
            echo "FILES_EXIST=false" >> $GITHUB_ENV
            exit 1
          fi

      - name: Create GitHub Release
        if: env.FILES_EXIST == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Downloaded Videos (${{ env.TAG_NAME }})"
          body_path: release_notes.md # Reads the generated file for release notes
          files: videos.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
